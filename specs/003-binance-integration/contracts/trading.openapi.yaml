openapi: 3.0.3
info:
  title: TRDIA Trading API
  version: 1.0.0
paths:
  /api/v1/trading/binance/credentials:
    post:
      summary: Save and validate Binance credentials
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key, secret_key]
              properties:
                api_key:
                  type: string
                secret_key:
                  type: string
      responses:
        '200':
          description: Credentials saved and verified
        '400':
          description: Invalid credentials
        '401':
          description: Unauthorized
  /api/v1/trading/binance/credentials/status:
    get:
      summary: Get Binance credential status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credential status and masked key suffix
  /api/v1/trading/execute:
    post:
      summary: Execute real or simulated spot trade
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, symbol, side, order_type, quantity, is_simulation]
              properties:
                request_id:
                  type: string
                symbol:
                  type: string
                side:
                  type: string
                  enum: [BUY, SELL]
                order_type:
                  type: string
                  enum: [MARKET, LIMIT]
                quantity:
                  type: number
                limit_price:
                  type: number
                  nullable: true
                is_simulation:
                  type: boolean
                source:
                  type: string
                  enum: [manual, agent]
      responses:
        '200':
          description: Trade execution result
        '403':
          description: Blocked by plan/risk validation
        '409':
          description: Duplicate idempotency request
        '422':
          description: Validation error
  /api/v1/trading/history:
    get:
      summary: Get paginated trade history
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: is_simulation
          schema:
            type: boolean
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated history list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
