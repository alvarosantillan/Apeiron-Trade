openapi: 3.0.3
info:
  title: TRDIA AI Agent API
  version: 1.0.0
  description: API contract for AI agent configuration, status, and decisions.
servers:
  - url: https://api.trdia.local
paths:
  /v1/ai-agent/providers:
    get:
      summary: List supported AI providers
      operationId: listAiProviders
      tags: [AI Agent]
      responses:
        '200':
          description: Providers returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
  /v1/ai-agent/strategies:
    get:
      summary: List enabled AI strategies
      operationId: listAiStrategies
      tags: [AI Agent]
      responses:
        '200':
          description: Strategies returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Strategy'
  /v1/ai-agent/config:
    put:
      summary: Create or update AI agent configuration
      operationId: upsertAiAgentConfig
      tags: [AI Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertConfigRequest'
      responses:
        '200':
          description: Configuration stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          description: Validation error
        '403':
          description: Plan restriction violation
    get:
      summary: Get active AI agent configuration
      operationId: getAiAgentConfig
      tags: [AI Agent]
      responses:
        '200':
          description: Configuration returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '404':
          description: No active configuration
  /v1/ai-agent/decisions:
    get:
      summary: List AI decisions for authenticated user
      operationId: listAiDecisions
      tags: [AI Agent]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Decision list returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
  /v1/ai-agent/decisions/{decisionId}/approve:
    post:
      summary: Approve pending AI decision (manual flow)
      operationId: approveAiDecision
      tags: [AI Agent]
      parameters:
        - in: path
          name: decisionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision approved
        '404':
          description: Decision not found
        '409':
          description: Invalid decision state
  /v1/ai-agent/decisions/{decisionId}/reject:
    post:
      summary: Reject pending AI decision
      operationId: rejectAiDecision
      tags: [AI Agent]
      parameters:
        - in: path
          name: decisionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision rejected
        '404':
          description: Decision not found
        '409':
          description: Invalid decision state
components:
  schemas:
    Provider:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          enum: [OPENAI, GROQ, DEEPSEEK, GEMINI]
        name:
          type: string
    Strategy:
      type: object
      required: [id, code, name, enabled]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    UpsertConfigRequest:
      type: object
      required: [provider, apiKey, strategyId, riskProfile, mode]
      properties:
        provider:
          type: string
          enum: [OPENAI, GROQ, DEEPSEEK, GEMINI]
        apiKey:
          type: string
          minLength: 10
        strategyId:
          type: string
          format: uuid
        riskProfile:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        mode:
          type: string
          enum: [MANUAL, AUTOMATIC]
        isActive:
          type: boolean
          default: true
    ConfigResponse:
      type: object
      required: [id, provider, strategyId, riskProfile, mode, isActive, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        strategyId:
          type: string
          format: uuid
        riskProfile:
          type: string
        mode:
          type: string
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    Decision:
      type: object
      required:
        [id, action, confidence, riskLevel, status, symbol, timeframe, decisionTs]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [BUY, SELL, HOLD]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        status:
          type: string
          enum: [PENDING_APPROVAL, EXECUTED, REJECTED, FALLBACK_HOLD]
        symbol:
          type: string
        timeframe:
          type: string
        reasoning:
          type: string
        fallbackReason:
          type: string
          nullable: true
        decisionTs:
          type: string
          format: date-time
