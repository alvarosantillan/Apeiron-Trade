openapi: 3.0.3
info:
  title: TRDIA Auth API
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register user with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User created
        '409':
          description: Email already exists
  /api/v1/auth/login:
    post:
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: JWT pair
        '401':
          description: Invalid credentials
  /api/v1/auth/oauth/google:
    post:
      summary: Login with Google token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
      responses:
        '200':
          description: JWT pair
        '401':
          description: Invalid OAuth token
  /api/v1/auth/oauth/facebook:
    post:
      summary: Login with Facebook token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token:
                  type: string
      responses:
        '200':
          description: JWT pair
        '401':
          description: Invalid OAuth token
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue new JWT pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New JWT pair
        '401':
          description: Invalid or revoked refresh token
  /api/v1/auth/logout:
    post:
      summary: Revoke current refresh session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Session revoked
  /api/v1/auth/logout-all:
    post:
      summary: Revoke all sessions for current user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked
  /api/v1/users/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile data
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


