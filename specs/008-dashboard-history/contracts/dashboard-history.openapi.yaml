openapi: 3.0.3
info:
  title: TRDIA Dashboard and History API
  version: 1.0.0
  description: API contract for operational dashboard, trade history, detail, and KPIs.
servers:
  - url: https://api.trdia.local
paths:
  /v1/dashboard/summary:
    get:
      summary: Get dashboard summary for authenticated user
      operationId: getDashboardSummary
      tags: [Dashboard]
      responses:
        '200':
          description: Dashboard summary returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
  /v1/dashboard/kpis:
    get:
      summary: Get KPI aggregates for a supported window
      operationId: getDashboardKpis
      tags: [Dashboard]
      parameters:
        - in: query
          name: window
          required: true
          schema:
            type: string
            enum: [7d, 30d]
      responses:
        '200':
          description: KPI aggregates returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '400':
          description: Invalid window
  /v1/history/trades:
    get:
      summary: List trade history with filters and pagination
      operationId: listTradeHistory
      tags: [History]
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: status
          schema:
            type: string
            enum: [EXECUTED, FAILED, BLOCKED, CANCELLED]
        - in: query
          name: isSimulation
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Trade history returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeHistoryResponse'
  /v1/history/trades/{tradeId}:
    get:
      summary: Get trade detail by tradeId
      operationId: getTradeDetail
      tags: [History]
      parameters:
        - in: path
          name: tradeId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trade detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeDetail'
        '404':
          description: Trade not found
components:
  schemas:
    DashboardSummary:
      type: object
      required:
        [planCode, operationsUsed, operationsLimit, botStatus, updatedAt]
      properties:
        planCode:
          type: string
        operationsUsed:
          type: integer
        operationsLimit:
          type: integer
          nullable: true
        botStatus:
          type: string
          enum: [ACTIVE, PAUSED, INACTIVE]
        balanceSnapshot:
          type: number
          nullable: true
        updatedAt:
          type: string
          format: date-time
    KpiResponse:
      type: object
      required: [window, totalTrades, winRate, netPnl, avgReturn, updatedAt]
      properties:
        window:
          type: string
          enum: [7d, 30d]
        totalTrades:
          type: integer
        winRate:
          type: number
          minimum: 0
          maximum: 1
        netPnl:
          type: number
        avgReturn:
          type: number
        updatedAt:
          type: string
          format: date-time
    TradeHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TradeHistoryItem'
        nextCursor:
          type: string
          nullable: true
    TradeHistoryItem:
      type: object
      required:
        [tradeId, symbol, side, status, quantity, isSimulation, createdAt]
      properties:
        tradeId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        status:
          type: string
          enum: [EXECUTED, FAILED, BLOCKED, CANCELLED]
        executedPrice:
          type: number
          nullable: true
        quantity:
          type: number
        isSimulation:
          type: boolean
        pnl:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
    TradeDetail:
      type: object
      required:
        [tradeId, requestId, status, symbol, side, quantity, createdAt]
      properties:
        tradeId:
          type: string
          format: uuid
        requestId:
          type: string
        status:
          type: string
          enum: [EXECUTED, FAILED, BLOCKED, CANCELLED]
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
        executedPrice:
          type: number
          nullable: true
        isSimulation:
          type: boolean
        failureReason:
          type: string
          nullable: true
        executionTrace:
          type: object
        createdAt:
          type: string
          format: date-time
